services:
  postgres:
    image: postgres:16
    container_name: planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plannerdb
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner123
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d plannerdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: planner-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plannerdb
      SPRING_DATASOURCE_USERNAME: planner
      SPRING_DATASOURCE_PASSWORD: planner123
      JWT_SECRET: ${JWT_SECRET:-planner-api-demo-secret-change-me-please-32chars}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
